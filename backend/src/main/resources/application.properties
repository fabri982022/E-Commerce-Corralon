spring.application.name=digital
server.port=8080

# Carga las variables del archivo .env de la raíz del proyecto (si existe).
# Las variables de entorno reales del sistema tienen prioridad sobre este archivo.
spring.config.import=optional:file:./.env[.properties]

# ---------- Base de datos (MySQL local) ----------
# createDatabaseIfNotExist crea la base "ferreteria" la primera vez
spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:alumno2008}

# ---------- JPA / Hibernate ----------
# update: crea y ajusta las tablas desde las entidades (solo para desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Las conversiones a DTO se hacen dentro de los services (@Transactional), no en los controllers
spring.jpa.open-in-view=false

# ---------- Docker Compose ----------
# Se usa MySQL local; poner en true si más adelante se levanta con compose.yaml
spring.docker.compose.enabled=false

# ---------- Carga de archivos ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Cloudinary ----------
# Definir como variables de entorno; vacías por defecto para que la app arranque sin ellas
# (la subida de imágenes falla hasta que se configuren)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}