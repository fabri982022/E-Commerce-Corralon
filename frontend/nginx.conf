server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mismo límite que las imágenes del backend (5 MB + margen del formulario)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # La API se pide por el mismo origen (/api/...): el navegador no necesita CORS
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aplicación de una sola página: cualquier ruta del navegador devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
